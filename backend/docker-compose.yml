services:
  mongodb:
    image: mongo:7.0
    container_name: trustvault-mongodb
    restart: unless-stopped
    ports:
      # Bound strictly to localhost to prevent exposure over LAN/WAN
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-trustadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-trustpassword}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-trustvault}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - "CMD"
        - "mongosh"
        - "-u"
        - "${MONGO_INITDB_ROOT_USERNAME:-trustadmin}"
        - "-p"
        - "${MONGO_INITDB_ROOT_PASSWORD:-trustpassword}"
        - "--authenticationDatabase"
        - "admin"
        - "--eval"
        - "db.adminCommand('ping')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: trustvault-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-trustadmin}:${MONGO_INITDB_ROOT_PASSWORD:-trustpassword}@mongodb:27017/${MONGO_INITDB_DATABASE:-trustvault}?authSource=admin
      SESSION_SECRET: ${SESSION_SECRET:-trustvault-production-session-secret-change-me-in-production-64bytes}
      COOKIE_SECRET: ${COOKIE_SECRET:-trustvault-production-cookie-secret-change-me-in-production-64bytes}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - storage-data:/app/storage

volumes:
  mongo-data:
    driver: local
  storage-data:
    driver: local
